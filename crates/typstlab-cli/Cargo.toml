[package]
name = "typstlab-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "typstlab"
path = "src/main.rs"

[dependencies]
typstlab-proto = { path = "../typstlab-proto" }
typstlab-base = { path = "../typstlab-base" }
typstlab-app = { path = "../typstlab-app" }
typstlab-mcp = { path = "../typstlab-mcp" }
anyhow = "1"
thiserror = "2"
dirs = "5"
clap = { version = "4", features = ["derive"] }
colored = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
