[package]
name = "typstlab-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
typstlab-proto = { path = "../typstlab-proto" }
typstlab-base = { path = "../typstlab-base" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
colored = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tar = "0.4"
xz2 = "0.1"
