[package]
name = "typstlab-toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
html-escape = "0.2"
html5gum = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
thiserror = "2"
typstlab-proto = { path = "../typstlab-proto" }

[dev-dependencies]
