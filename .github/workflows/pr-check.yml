name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CHANGELOG_PATH: CHANGELOG.md
  CHANGELOG_TITLE: Changelog
  CHANGELOG_HEADER: |
    All notable changes to this project will be documented in this file.

    The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
    and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
  RELEASE_NOTES_HEADING: Release Notes
  ALLOWED_CATEGORIES: Added,Changed,Deprecated,Removed,Fixed,Security
  FALLBACK_CATEGORY: Other
  RELEASE_BRANCH_PATTERN: release/v{version}
  RELEASE_TAG_PATTERN: v{version}
  RELEASE_PR_TITLE_PATTERN: "release: v{version}"
  RELEASE_PR_LABEL: release-pr
  RELEASE_DRAFT: "true"

jobs:
  pr-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            release:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/**"
              - ".github/scripts/packages/release/**"
              - ".github/workflows/pr-check.yml"

      - name: Skip PR check
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.release != 'true'
        run: echo "No release-related files changed."

      - name: Setup Bun
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release == 'true'
        uses: oven-sh/setup-bun@v2

      - name: install
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release == 'true'
        run: bun install
        working-directory: .github/scripts

      - name: build
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release == 'true'
        run: bun run build:index
        working-directory: .github/scripts

      - name: PR Check
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { loadReleaseConfig, runPrCheckFromActionArgs } = await import('${{ github.workspace }}/.github/scripts/packages/release/dist/index.js');
            const configResult = loadReleaseConfig(process.env);

            if (configResult.kind === 'invalid') {
              core.setFailed(configResult.errors.join('\n'));
              return;
            }

            const result = await runPrCheckFromActionArgs(configResult.config, { github, context });

            for (const finding of result.findings) {
              core[finding.severity](finding.message);
            }

            if (result.kind === 'failure') {
              core.setFailed('Release PR check failed');
            }
