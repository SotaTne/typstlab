# Based on Typst's release action:
# https://github.com/typst/typst/blob/main/.github/workflows/release.yml

name: Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.2. Leave empty to build artifacts only."
        required: false
        type: string
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CROSS_NO_WARNINGS: 0
  CROSS_REV: 085092ca

jobs:
  release-context:
    name: resolve release context
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
      is_release_target: ${{ steps.resolve.outputs.is_release_target }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release context
        id: resolve
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.release_tag }}"

          if [[ -n "$tag" ]]; then
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Release tag does not exist: $tag" >&2
              exit 1
            fi
            ref="$tag"
            version="${tag#v}"
            is_release_target="true"
          else
            ref="${{ github.ref }}"
            version="workflow-dispatch"
            is_release_target="false"
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_release_target=$is_release_target" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: release-context
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Run Cross
        if: ${{ matrix.cross }}
        run: |
          cargo install cross --git https://github.com/cross-rs/cross.git --locked --rev "$CROSS_REV"
          cross build -p typstlab-cli --release --target ${{ matrix.target }}

      - name: Run Cargo
        if: ${{ !matrix.cross }}
        run: cargo build -p typstlab-cli --release --target ${{ matrix.target }}

      - name: create artifact directory
        shell: bash
        run: |
          directory="typstlab-${{ matrix.target }}"
          mkdir "$directory"

          if [[ -f "target/${{ matrix.target }}/release/typstlab.exe" ]]; then
            cp "target/${{ matrix.target }}/release/typstlab.exe" "$directory/"
            7z a "$directory.zip" "$directory"
          else
            cp "target/${{ matrix.target }}/release/typstlab" "$directory/"
            tar cJf "$directory.tar.xz" "$directory"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: typstlab-${{ matrix.target }}
          path: typstlab-${{ matrix.target }}.*
          retention-days: 3

      - uses: ncipollo/release-action@v1
        if: github.event_name == 'release'
        with:
          artifacts: typstlab-${{ matrix.target }}.*
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true

  checksum-and-upload:
    name: checksum, sign, upload
    runs-on: ubuntu-latest
    needs:
      - release-context
      - build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.ref }}

      - uses: actions/download-artifact@v6
        with:
          pattern: typstlab-*
          path: dist
          merge-multiple: true

      - name: Export release context
        shell: bash
        run: |
          echo "RELEASE_TAG=${{ needs.release-context.outputs.release_tag }}" >> "$GITHUB_ENV"
          echo "VERSION=${{ needs.release-context.outputs.version }}" >> "$GITHUB_ENV"
          echo "IS_RELEASE_TARGET=${{ needs.release-context.outputs.is_release_target }}" >> "$GITHUB_ENV"

      - name: Create checksum file
        shell: bash
        working-directory: dist
        run: shasum -a 256 typstlab-* > sha256.txt

      - name: Resolve Homebrew source checksum
        if: env.IS_RELEASE_TARGET == 'true'
        id: homebrew-source
        shell: bash
        run: |
          url="https://github.com/SotaTne/typstlab/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          sha256="$(curl -fsSL "$url" | shasum -a 256 | awk '{ print $1 }')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Copy minisign public key
        shell: bash
        run: cp minisign.pub dist/minisign.pub

      - name: Install minisign
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign checksum file
        shell: bash
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "MINISIGN_SECRET_KEY is required to sign sha256.txt" >&2
            exit 1
          fi
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          chmod 600 minisign.key
          minisign -S -s minisign.key -m sha256.txt -x sha256.txt.minisig -t "typstlab $VERSION checksums"
          rm minisign.key

      - uses: actions/upload-artifact@v6
        if: env.IS_RELEASE_TARGET != 'true'
        with:
          name: release-checksums
          path: |
            dist/sha256.txt
            dist/sha256.txt.minisig
            dist/minisign.pub
          if-no-files-found: error
          retention-days: 3

      - uses: ncipollo/release-action@v1
        if: github.event_name == 'release'
        with:
          tag: ${{ env.RELEASE_TAG }}
          artifacts: |
            dist/sha256.txt
            dist/sha256.txt.minisig
            dist/minisign.pub
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true

      - uses: ncipollo/release-action@v1
        if: github.event_name == 'workflow_dispatch' && env.IS_RELEASE_TARGET == 'true'
        with:
          tag: ${{ env.RELEASE_TAG }}
          artifacts: |
            dist/typstlab-*
            dist/sha256.txt
            dist/sha256.txt.minisig
            dist/minisign.pub
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true

      - name: Bump Homebrew formula
        if: env.IS_RELEASE_TARGET == 'true'
        id: bump-homebrew
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: typstlab
          formula-path: Formula/typstlab.rb
          homebrew-tap: SotaTne/homebrew-tap
          tag-name: ${{ env.RELEASE_TAG }}
          download-url: ${{ steps.homebrew-source.outputs.url }}
          download-sha256: ${{ steps.homebrew-source.outputs.sha256 }}
          create-pullrequest: true
          commit-message: |
            {{formulaName}} {{version}}

            Created by https://github.com/mislav/bump-homebrew-formula-action
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Label Homebrew formula PR
        if: env.IS_RELEASE_TARGET == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          pr_number="$(gh pr list \
            --repo SotaTne/homebrew-tap \
            --state open \
            --search "typstlab ${VERSION} in:title" \
            --json number \
            --jq '.[0].number')"

          if [[ -z "$pr_number" ]]; then
            echo "Homebrew formula PR was not found for typstlab ${VERSION}" >&2
            exit 1
          fi

          gh label create autopublish-bottle \
            --repo SotaTne/homebrew-tap \
            --color 0E8A16 \
            --description "Automatically publish Homebrew bottles after test-bot succeeds" \
            || true

          gh pr edit "$pr_number" \
            --repo SotaTne/homebrew-tap \
            --add-label autopublish-bottle
