name: JSON Schema Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  validate:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            json_schema:
              - "crates/typstlab-base/src/version_resolver_jsons/*.json"
              - ".github/workflows/check-version-resolve-json-schema.yml"
              - ".github/scripts/packages/toolchain-monitor/ajv/*.cjs"

      - name: Skip JSON schema validation
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.json_schema != 'true'
        run: echo "No JSON schema related files changed."

      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.json_schema == 'true'

      - name: Compile schema file
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.json_schema == 'true'
        run: bun run json-check:schema
        working-directory: .github/scripts

      - name: Validate resolver JSON files
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.json_schema == 'true'
        run: bun run json-check:files
        working-directory: .github/scripts
